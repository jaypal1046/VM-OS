name: Build and Release SplitOS Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew
        if: runner.os != 'Windows'

      - name: Build Guest OS Image Asset
        run: python os/build_guest_os.py

      - name: Run Native Virtualization Core Tests
        run: |
          gcc -Wall -Wextra \
            -Iandroid/app/src/main/cpp \
            -Iandroid/app/src/main/cpp/display \
            -Iandroid/app/src/main/cpp/serial \
            -Iandroid/app/src/main/cpp/vm_core \
            android/app/src/main/cpp/display/display_bridge.c \
            android/app/src/main/cpp/serial/uart_ipc.c \
            android/app/src/main/cpp/os_compositor.c \
            android/app/src/main/cpp/vm_core/vm_engine.c \
            android/app/src/main/cpp/test_vm_core.c \
            -o test_vm_core -lpthread
          ./test_vm_core

      - name: Build Release APK
        run: |
          cd android
          ./gradlew testDebugUnitTest assembleRelease

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
