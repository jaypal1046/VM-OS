name: Build and Release SplitOS Guest OS Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-os:
    name: Build Guest OS Rootfs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Guest OS Unit Tests
        run: |
          cd os
          gcc -Wall -Wextra -Ikernel -Icompositor -Iapps apps/calculator.c apps/shell.c apps/apps.c compositor/compositor.c test_guest_os.c -o test_guest
          ./test_guest

      - name: Compile and Package Guest OS Image
        run: |
          python os/build_guest_os.py
          gzip -c android/app/src/main/assets/guest_os.bin > split-os-rootfs.img.gz

      - name: Upload OS Image to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            split-os-rootfs.img.gz
            android/app/src/main/assets/guest_os.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
